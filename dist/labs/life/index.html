<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LIFE — The Journey of Evolution</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Manrope:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --scene-bg:#0b2a2f;
  --ink:#10201c; --ink-2:#3e524b; --ink-3:#62766e;
  --glass:rgba(240,245,242,.86); --glass-strong:rgba(246,250,248,.97);
  --line:rgba(20,23,38,.12); --chip:rgba(20,23,38,.06); --chip-on:rgba(20,23,38,.15);
  --accent:#1d7a60; --accent-ink:#f2fff9; --focus:#2f62e6;
  --shadow:0 24px 70px rgba(0,0,12,.38);
  --on-scene:#f4efe2; --on-scene-2:rgba(244,239,226,.72); --on-scene-3:rgba(244,239,226,.45);
  --serif:"Cormorant Garamond", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans:"Manrope", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --scene-bg:#020b0d;
    --ink:#e6f1ec; --ink-2:#b2c6be; --ink-3:#829a91;
    --glass:rgba(6,20,22,.68); --glass-strong:rgba(5,17,19,.94);
    --line:rgba(255,255,255,.1); --chip:rgba(255,255,255,.06); --chip-on:rgba(255,255,255,.17);
    --accent:#86e3be; --accent-ink:#04150f; --focus:#9ec1ff;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --scene-bg:#020b0d;
  --ink:#e6f1ec; --ink-2:#b2c6be; --ink-3:#829a91;
  --glass:rgba(6,20,22,.68); --glass-strong:rgba(5,17,19,.94);
  --line:rgba(255,255,255,.1); --chip:rgba(255,255,255,.06); --chip-on:rgba(255,255,255,.17);
  --accent:#86e3be; --accent-ink:#04150f; --focus:#9ec1ff;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
html,body{margin:0;height:100%;overflow:hidden;background:var(--scene-bg);font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:8px}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden;transition:opacity .8s}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;pointer-events:auto;cursor:pointer;color:var(--on-scene);text-shadow:0 1px 8px rgba(0,0,0,.9),0 0 2px rgba(0,0,0,.8);font-size:12px;font-weight:500;letter-spacing:.01em;line-height:1.2;text-align:center;will-change:transform,opacity;user-select:none}
.lbl small{display:block;font-size:10.5px;font-weight:400;color:var(--on-scene-2)}
.lbl.i3{font-family:var(--serif);font-size:19px;font-weight:500;letter-spacing:.015em}
.lbl.i3 small{font-family:var(--sans)}
.lbl.i1{font-size:11px;color:var(--on-scene-2)}
.lbl.hov,.lbl.sel{color:#fff}
.lbl.orig{font-family:var(--serif);font-style:italic;font-size:15px}
.era{position:absolute;left:0;top:0;pointer-events:none;font-family:var(--serif);font-style:italic;font-weight:300;font-size:26px;color:var(--on-scene-3);white-space:nowrap;will-change:transform,opacity}

/* Home */
#home{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center;padding:calc(env(safe-area-inset-top,0px) + 24px) 24px calc(env(safe-area-inset-bottom,0px) + 9vh);background:linear-gradient(to bottom,rgba(3,4,10,0) 35%,rgba(3,4,10,.7) 100%);transition:opacity 1.1s ease,visibility 1.1s;z-index:30}
#home.hide{opacity:0;visibility:hidden;pointer-events:none}
#home h1{margin:0;text-shadow:0 2px 30px rgba(0,0,0,.6);font-family:var(--serif);font-weight:300;font-size:clamp(54px,11vw,138px);letter-spacing:.32em;margin-right:-.32em;line-height:1;color:var(--on-scene)}
#home .sub1{font-family:var(--serif);font-style:italic;font-weight:300;font-size:clamp(24px,3.6vw,38px);color:var(--on-scene);margin:.35em 0 0}
#home .sub2{max-width:34em;margin:1.4em auto 0;font-size:15px;line-height:1.65;color:var(--on-scene-2)}
.home-actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:34px}
.btn{border:1px solid rgba(244,239,226,.28);background:rgba(244,239,226,.06);color:var(--on-scene);padding:13px 22px;border-radius:999px;font-size:14px;font-weight:600;letter-spacing:.02em;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:background .25s,border-color .25s}
.btn:hover{background:rgba(244,239,226,.14);border-color:rgba(244,239,226,.5)}
.btn.primary{background:var(--on-scene);color:#14110a;border-color:transparent}
.btn.primary:hover{background:#fff}
.later{margin-top:30px;color:var(--on-scene-3);font-size:12.5px;line-height:1.9;max-width:40em}
.later button{background:none;border:0;color:var(--on-scene-2);text-decoration:underline;text-decoration-color:rgba(244,239,226,.25);text-underline-offset:3px;padding:0 4px;font-size:12.5px}

/* Top bar */
#topbar{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 0;z-index:20;pointer-events:none;transition:opacity .6s}
#topbar>*{pointer-events:auto}
.pill{display:flex;align-items:center;gap:8px;height:42px;padding:0 14px;border-radius:999px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);box-shadow:0 8px 30px rgba(0,0,10,.25);color:var(--ink);font-size:13px;font-weight:600}
.pill.icon{width:42px;justify-content:center;padding:0}
.pill svg{width:18px;height:18px;flex:none}
.brand{font-family:var(--serif);font-size:19px;font-weight:500;letter-spacing:.18em;padding-right:10px;gap:0}
#searchWrap{position:relative;flex:1;min-width:0;max-width:420px;margin:0 auto}
#searchWrap .pill{width:100%;cursor:text}
#search{flex:1;min-width:0;width:100%;border:0;background:transparent;font:inherit;font-weight:500;color:var(--ink);outline:none}
#search::placeholder{color:var(--ink-3)}
#results{position:absolute;top:50px;left:0;right:0;background:var(--glass-strong);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;display:none;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
#results.open{display:block}
#results button{display:flex;width:100%;align-items:center;gap:10px;text-align:left;padding:11px 14px;border:0;background:none;border-bottom:1px solid var(--line);font-size:13.5px}
#results button:last-child{border-bottom:0}
#results button:hover,#results button.act{background:var(--chip)}
#results .rd{margin-left:auto;color:var(--ink-3);font-size:12px;white-space:nowrap}
#results .empty{padding:14px;color:var(--ink-3);font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 8px currentColor}
.tb-right{display:flex;gap:8px}

/* Side panel */
.sheet{position:fixed;z-index:25;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);box-shadow:var(--shadow);color:var(--ink);display:flex;flex-direction:column;transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .4s}
#panel{top:calc(env(safe-area-inset-top,0px) + 70px);right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 104px);width:min(420px,calc(100vw - 32px));border-radius:24px;transform:translateX(calc(100% + 40px));opacity:0}
#panel.open{transform:none;opacity:1}
#filters{top:calc(env(safe-area-inset-top,0px) + 70px);left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 104px);width:min(330px,calc(100vw - 32px));border-radius:24px;transform:translateX(calc(-100% - 40px));opacity:0}
#filters.open{transform:none;opacity:1}
.sheet-head{display:flex;align-items:flex-start;gap:10px;padding:20px 20px 0}
.sheet-body{overflow-y:auto;padding:6px 22px 24px;flex:1;-webkit-overflow-scrolling:touch}
.close{margin-left:auto;flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--chip);display:grid;place-items:center}
.close svg{width:16px;height:16px}
.kicker{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);font-weight:600;padding-top:7px}
#panel h2{font-family:var(--serif);font-weight:500;font-size:34px;line-height:1.05;margin:8px 0 6px;letter-spacing:.005em}
.alt{color:var(--ink-2);font-family:var(--serif);font-style:italic;font-size:18px;margin:0 0 10px}
.meta{font-size:13px;color:var(--ink-2);line-height:1.6;margin:0 0 14px}
.meta b{color:var(--ink);font-weight:600}
.evbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--chip);padding:7px 12px;border-radius:999px;font-size:12.5px;font-weight:600}
.evbox{display:none;margin-top:10px;padding:14px;border-radius:14px;background:var(--chip);font-size:13px;line-height:1.6;color:var(--ink-2)}
.evbox.open{display:block}
.evbox p{margin:0 0 8px}.evbox p:last-child{margin:0}
.lede{font-family:var(--serif);font-size:19.5px;line-height:1.5;margin:18px 0 6px;color:var(--ink)}
.sec{margin-top:22px}
.sec h3{font-size:12.5px;font-weight:700;color:var(--ink-3);margin:0 0 10px;letter-spacing:.02em}
.pv{padding:12px 0;border-top:1px solid var(--line)}
.pv:first-of-type{border-top:0;padding-top:0}
.pv b{display:block;font-size:13px;font-weight:700;margin-bottom:4px}
.pv p{margin:0;font-size:14px;line-height:1.6;color:var(--ink-2)}
.txt{font-size:14px;line-height:1.65;color:var(--ink-2);margin:0}
.src{font-size:12.5px;line-height:1.6;color:var(--ink-3)}
.links{display:flex;flex-wrap:wrap;gap:8px}
.link{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:600}
.link i{font-style:normal;font-weight:500;color:var(--ink-3)}
.swatch{width:20px;height:0;border-top:2px solid currentColor;flex:none}
.swatch.dash{border-top-style:dashed}.swatch.dot{border-top-style:dotted;border-top-width:3px}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13px}
.bar span:last-child{color:var(--ink-3);font-variant-numeric:tabular-nums}
.bar i{grid-column:1/-1;height:6px;border-radius:6px;background:var(--chip);overflow:hidden;display:block}
.bar i b{display:block;height:100%;border-radius:6px;background:var(--accent)}

/* Filters */
#filters h2{font-family:var(--serif);font-weight:500;font-size:28px;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 12px;font-size:12.5px;font-weight:600;color:var(--ink-3);transition:background .2s,color .2s}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--ink)}
.chip .dot{opacity:.35}.chip[aria-pressed="true"] .dot{opacity:1}
.legend{display:flex;flex-direction:column;gap:10px;font-size:13px;line-height:1.5;color:var(--ink-2)}
.legend div{display:grid;grid-template-columns:22px 1fr;gap:6px}
.legend b{color:var(--ink);font-weight:600}
.reset{margin-top:22px;border:1px solid var(--line);background:var(--chip);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600}

/* Time bar */
#timebar{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);width:min(780px,calc(100vw - 32px));z-index:20;display:flex;align-items:center;gap:14px;padding:12px 18px 12px 12px;border-radius:24px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);box-shadow:0 10px 40px rgba(0,0,10,.3);transition:opacity .6s}
#play{flex:none;width:46px;height:46px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
#play svg{width:18px;height:18px}
.tb-mid{flex:1;min-width:0}
.tb-read{display:flex;align-items:baseline;gap:10px;margin-bottom:6px;white-space:nowrap;overflow:hidden}
#eraName{font-family:var(--serif);font-size:20px;font-weight:500;overflow:hidden;text-overflow:ellipsis}
#yearRead{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;margin-left:auto;font-weight:600}
#slider{width:100%;-webkit-appearance:none;appearance:none;height:22px;background:transparent;margin:0}
#slider::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:linear-gradient(90deg,var(--chip-on),var(--accent),var(--chip-on))}
#slider::-moz-range-track{height:3px;border-radius:3px;background:linear-gradient(90deg,var(--chip-on),var(--accent),var(--chip-on))}
#slider::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);margin-top:-7.5px;border:3px solid var(--glass-strong);box-shadow:0 0 0 1px var(--line)}
#slider::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--accent);border:3px solid var(--glass-strong)}

.ui-hidden #topbar,.ui-hidden #timebar{opacity:0;pointer-events:none}
.ui-hidden #topbar>*{pointer-events:none}

/* Origins overlay */
#origins,.ov{position:fixed;inset:0;z-index:40;background:var(--glass-strong);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);display:flex;flex-direction:column;opacity:0;visibility:hidden;transition:opacity .5s,visibility .5s;color:var(--ink)}
#origins.open,.ov.open{opacity:1;visibility:visible}
.o-head{display:flex;align-items:flex-start;gap:16px;padding:calc(env(safe-area-inset-top,0px) + 22px) clamp(18px,4vw,48px) 8px}
.o-head h2{font-family:var(--serif);font-weight:400;font-size:clamp(32px,4.6vw,52px);line-height:1.02;margin:0}
.o-head p{max-width:46em;color:var(--ink-2);font-size:14.5px;line-height:1.65;margin:10px 0 0}
.o-body{flex:1;overflow-y:auto;padding:14px clamp(18px,4vw,48px) 120px;-webkit-overflow-scrolling:touch}
.o-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.ocard{position:relative;text-align:left;border:1px solid var(--line);background:var(--chip);border-radius:20px;padding:18px 18px 16px;transition:border-color .25s,background .25s;display:flex;flex-direction:column;gap:8px}
.ocard:hover{border-color:var(--ink-3)}
.ocard[aria-pressed="true"]{border-color:var(--accent);background:var(--chip-on)}
.ocard.flash{animation:flash 1.6s ease}
@keyframes flash{0%,100%{box-shadow:none}30%{box-shadow:0 0 0 3px var(--accent)}}
.ocard .ot{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.ocard h4{font-family:var(--serif);font-size:24px;font-weight:500;margin:0;line-height:1.1}
.ocard p{margin:0;font-size:13.5px;line-height:1.6;color:var(--ink-2)}
.ocard .src{margin-top:auto;padding-top:6px}
.kind{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);align-self:flex-start}
.kind.sci{border-color:#57c7e0;color:var(--ink)}
.sel-mark{position:absolute;top:14px;right:14px;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700}
.ocard[aria-pressed="true"] .sel-mark{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.o-tray{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);display:flex;align-items:center;gap:12px;padding:10px 10px 10px 20px;border-radius:999px;background:var(--ink);color:var(--glass-strong);box-shadow:var(--shadow);font-size:13.5px;font-weight:600;transition:opacity .3s, transform .3s;white-space:nowrap}
.o-tray.off{opacity:0;pointer-events:none;transform:translate(-50%,20px)}
.o-tray button{border:0;border-radius:999px;padding:10px 18px;background:var(--accent);color:var(--accent-ink);font-weight:700}
.o-tray .ghost{background:transparent;color:inherit;opacity:.75;padding:10px 8px}
.cmp{display:none;grid-auto-flow:column;grid-auto-columns:minmax(260px,1fr);gap:16px;overflow-x:auto;padding-bottom:8px}
.cmp.open{display:grid}
.cmp .ocard{cursor:default}
.cmp .ocard p{font-size:15px;font-family:var(--serif);line-height:1.55;font-size:18px}
.o-note{margin:22px 0 0;font-size:13px;color:var(--ink-3);line-height:1.6;max-width:52em}

#hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 120px);transform:translateX(-50%);padding:11px 18px;border-radius:999px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);font-size:13px;color:var(--ink-2);white-space:nowrap;opacity:0;transition:opacity .6s;pointer-events:none;z-index:19;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
#hint.show{opacity:1}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 72px);transform:translate(-50%,-10px);padding:11px 18px;border-radius:14px;background:var(--glass-strong);border:1px solid var(--line);box-shadow:var(--shadow);font-size:13.5px;color:var(--ink);opacity:0;transition:opacity .35s,transform .35s;pointer-events:none;z-index:50;max-width:calc(100vw - 32px);text-align:center;line-height:1.5}
#toast.show{opacity:1;transform:translate(-50%,0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:760px){
  .brand span{display:none}
  .brand{padding-right:14px;letter-spacing:.1em}
  #topbar{gap:8px;padding-left:12px;padding-right:12px}
  .tb-right .txtbtn{display:none}
  .tb-right{gap:6px}
  .tb-right .pill{width:40px;height:40px;padding:0;justify-content:center}
  .brand{width:40px;height:40px;padding:0;justify-content:center}
  #searchWrap .pill{height:40px}
  #panel,#filters{left:0;right:0;top:auto;width:auto;bottom:0;max-height:64vh;border-radius:24px 24px 0 0;transform:translateY(105%);padding-bottom:env(safe-area-inset-bottom,0px)}
  #panel.open,#filters.open{transform:none}
  #panel h2{font-size:29px}
  .lede{font-size:18px}
  #timebar{padding:10px 14px 10px 10px;gap:10px}
  #play{width:40px;height:40px}
  #eraName{font-size:17px}
  .lbl.i3{font-size:16px}
  #home h1{font-size:clamp(34px,11.5vw,60px);letter-spacing:.2em;margin-right:-.2em}
  #hint{white-space:normal;text-align:center;border-radius:16px;width:max-content}
  .o-tray{font-size:12.5px}
}
@media (max-width:760px){ .panel-open #timebar, .filters-open #timebar{opacity:0;pointer-events:none} }
@media (prefers-reduced-motion: reduce){
  .sheet,#home,#origins,#toast{transition:none}
}

/* ===== LIFE additions ===== */
[hidden]{display:none!important}
:root{--serif:"Cormorant Garamond","Noto Naskh Arabic","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--sans:"Manrope","Noto Naskh Arabic","Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
html[lang="ar"] #home .sub1,html[lang="ar"] .o-head h2,html[lang="ar"] #eraName{font-family:"Noto Naskh Arabic",var(--serif);font-style:normal}
.era.eon{font-size:28px;color:var(--on-scene-3);font-weight:300;letter-spacing:.04em}
.era.per{font-size:19px}
.lbl.lane{font-family:var(--serif);font-style:italic;font-size:17px;font-weight:500;color:var(--lc,#fff);text-shadow:0 1px 10px rgba(0,0,0,.9)}
.lbl.ext{color:#ffc2b8}
.lbl.merge{font-family:var(--serif);font-style:italic;font-size:15px;color:#d9f6ff}
.lbl .ev{display:inline-block;width:6px;height:6px;border-radius:50%;margin-left:6px;vertical-align:middle;box-shadow:0 0 6px currentColor}
.evbtn .dot{width:10px;height:10px}

addEventListener("resize",resize); resize();
const tmp=new V3(), tmp2=new V3();
function hideLbl(el){ if(el._v!==0){ el.style.opacity=0; el._v=0; el.style.pointerEvents="none"; } }
function placeLabel(el,world,maxDist,extraY){
  tmp.copy(world).project(camera); const dist=camera.position.distanceTo(world);
  if(tmp.z>1||tmp.z<-1||dist>maxDist||Math.abs(tmp.x)>1.15||Math.abs(tmp.y)>1.15){ hideLbl(el); return; }
  const x=(tmp.x*.5+.5)*innerWidth, y=(-tmp.y*.5+.5)*innerHeight, op=Math.min(1,(maxDist-dist)/(maxDist*.25));
  el.style.transform=`translate3d(${x.toFixed(1)}px,${y.toFixed(1)}px,0) translate(-50%,${extraY}px)`;
  if(Math.abs((el._v||0)-op)>.02){ el.style.opacity=op.toFixed(2); el._v=op; el.style.pointerEvents="none"; }
}
const LBL_DIST=[0,60,120,250]; const cands=[], placed=[];
function project(el,world,maxDist,extraY,pri){
  tmp.copy(world).project(camera); const dist=camera.position.distanceTo(world);
  if(tmp.z>1||tmp.z<-1||dist>maxDist||Math.abs(tmp.x)>1.15||Math.abs(tmp.y)>1.15){ hideLbl(el); return; }
  if(!el._w){ el._w=el.offsetWidth||80; el._h=el.offsetHeight||18; }
  cands.push({el,x:(tmp.x*.5+.5)*innerWidth,y:(-tmp.y*.5+.5)*innerHeight+extraY,op:Math.min(1,(maxDist-dist)/(maxDist*.25)),pri:pri-dist*.4});
}
function placeCands(){
  cands.sort((a,b)=>b.pri-a.pri);
  for(const c of cands){
    const w=c.el._w+10,h=c.el._h+4,l=c.x-w/2,tp=c.y; let hit=false;
    for(const p of placed){ if(l<p.r&&l+w>p.l&&tp<p.b&&tp+h>p.t){ hit=true; break; } }
    if(hit){ hideLbl(c.el); continue; }
    placed.push({l,r:l+w,t:tp,b:tp+h});
    c.el.style.transform=`translate3d(${c.x.toFixed(1)}px,${c.y.toFixed(1)}px,0) translate(-50%,0)`;
    if(Math.abs((c.el._v||0)-c.op)>.02){ c.el.style.opacity=c.op.toFixed(2); c.el._v=c.op; c.el.style.pointerEvents=c.op>.4?"auto":"none"; }
  }
}
function updateLabels(){
  if(homeMode) return;

  for(const n of nodes){

function extraPass(d){
  if(d.t>range.max+1e-9||d.t<range.min-1e-9) return false;
  if(!NL) return true;
  if(NL.lanes&&!NL.lanes.has(d.l)) return false;
  if(NL.tmax!=null&&!(d.t<NL.tmax)) return false;
  if(NL.tmin!=null&&!(d.t>NL.tmin)) return false;
  if(NL.inRange&&(d.t>NL.inRange[0]||d.t<NL.inRange[1])) return false;
  if(NL.hab&&!(d.h&&[...d.h].some(c=>NL.hab.has(c)))) return false;
  if(NL.st&&!NL.st.has(d.st)) return false;
  if(NL.kinds&&!NL.kinds.has(d.k)) return false;
  if(NL.ev&&!NL.ev.has(d.e)) return false;
  for(const tg of NL.tags) if(!TAGS[tg].has(d.id)) return false;
  for(const w of NL.kw) if(!d._hay.includes(w)) return false;
  return true;
}

const STOP=new Set("the a an with and or of in on at that which show me all from to for were was are is what who lived live first earliest than era period age time ago years year any some only like had have has that's med og i av som var de det fra til alle vis في من على مع التي الذي و".split(" ").map(norm));
const ANCH={dinosaurs:[231,66],dinosaur:[231,66],dinos:[231,66],dinosaurene:[231,66],"الديناصورات":[231,66],asteroid:[66,66],impact:[66,66],greatdying:[251.9,251.9],oxygen:[2400,2400],snowball:[690,690],flowers:[135,135],humans:[0.3,0.3],trilobites:[521,252]};
const PER_WORD={};
for(let i=0;i<PERIODS.length;i++){ const s=PERIODS[i][0], e=i<PERIODS.length-1?PERIODS[i+1][0]:0, k=PERIODS[i][1]; for(const L of ["en","no"]) PER_WORD[norm(T[L].per[k])]=[s,e]; PER_WORD[k]=[s,e]; }
Object.assign(PER_WORD,{precambrian:[4540,538.8],prekambrium:[4540,538.8],paleozoic:[538.8,251.9],paleozoikum:[538.8,251.9],mesozoic:[251.9,66],mesozoikum:[251.9,66],cenozoic:[66,0],kenozoikum:[66,0],archean:[4000,2500],proterozoic:[2500,538.8],today:[0.012,0],holocene:[0.0117,0]});
function stem(w){ return w.length>4&&w.endsWith("ies")?w.slice(0,-3)+"y":w.length>3&&w.endsWith("s")&&!w.endsWith("ss")?w.slice(0,-1):w; }
function parseNL(q){
  const s=norm(q).replace(/great dying/g,"greatdying").replace(/cambrian explosion/g,"cambrian").replace(/[,.;:!?«»“”"()]/g," ");
  const w=s.split(/\s+/).filter(Boolean);
  const R={lanes:null,tags:[],hab:null,st:null,kinds:null,ev:null,kw:[],tmax:null,tmin:null,inRange:null,chips:[]};
  const add=(key,v)=>{ if(!R[key]) R[key]=new Set(); for(const x of v.split(" ")) R[key].add(x); };
  function anchor(j,dir){
    while(j<w.length&&STOP.has(w[j])) j++;
    if(j>=w.length) return null;
    const x=w[j], num=parseFloat(x.replace(",","."));
    if(!isNaN(num)){
      const u=w[j+1]||""; let m=num, used=1;
      if(/^(billion|bn|ga|gyr|milliard|مليار)/.test(u)){ m=num*1000; used=2; }
      else if(/^(million|ma|myr|mya|million|millioner|مليون)/.test(u)){ used=2; }
      else if(/^(thousand|ka|tusen|ألف)/.test(u)){ m=num/1000; used=2; }
      else if(/^(years?|ar|år|سنة)$/.test(u)){ m=num/1e6; used=2; }
      else if(/ga$/.test(x)) m=num*1000; else if(/ka$/.test(x)) m=num/1000;
      let k=j+used; while(k<w.length&&/^(years?|ago|ar|år|siden|سنة|مضت)$/.test(w[k])) k++;
      return {val:m,next:k,label:fmtMa(m)};
    }
    if(ANCH[x]) return {val:dir==="before"?ANCH[x][0]:ANCH[x][1],next:j+1,label:x};
    if(PER_WORD[x]) return {val:dir==="before"?PER_WORD[x][0]:PER_WORD[x][1],next:j+1,label:x};
    return null;
  }
  let i=0;
  while(i<w.length){
    const x=w[i];
    if(AFTER.has(x)||BEFORE.has(x)){
      const dir=AFTER.has(x)?"after":"before", a=anchor(i+1,dir);
      if(a){ if(dir==="after") R.tmax=a.val; else R.tmin=a.val; R.chips.push(["clock",(dir==="after"?t("nlAfter"):t("nlBefore"))+" "+(typeof a.val==="number"&&!/^[a-z]/.test(a.label)?a.label:a.label)]); i=a.next; continue; }
      i++; continue;
    }
    if(STOP.has(x)){ i++; continue; }
    if(PER_WORD[x]){ R.inRange=PER_WORD[x]; R.chips.push(["clock",x]); i++; continue; }
    if(W_TAG.has(x)){ const tg=W_TAG.get(x); if(!R.tags.includes(tg)) R.tags.push(tg); R.chips.push(["target",x]); i++; continue; }
    if(W_LANE.has(x)){ const k=W_LANE.get(x); add("lanes",k); if(k==="bac"&&/microbe|mikrob/.test(x)){ add("lanes","arc"); add("lanes","pro"); } R.chips.push([k,tt("lanes",k)]); i++; continue; }
    if(W_HAB.has(x)){ const k=W_HAB.get(x); add("hab",k); R.chips.push(["h_"+k,tt("hab",k)]); i++; continue; }
    if(W_ST.has(x)){ const k=W_ST.get(x); add("st",k); R.chips.push(["s_"+k,tt("stat",k)]); i++; continue; }
    if(W_KIND.has(x)){ const k=W_KIND.get(x); add("kinds",k); R.chips.push(["k_"+k,tt("kinds",k)]); i++; continue; }
    if(W_EV.has(x)){ const k=W_EV.get(x); add("ev",k); R.chips.push(["dot:"+k,tt("ev",k)]); i++; continue; }
    if(x==="well"&&w[i+1]==="established"){ add("ev","g"); R.chips.push(["dot:g",tt("ev","g")]); i+=2; continue; }
    if(!isNaN(parseFloat(x))){ i++; continue; }
    if(x.length>2){ const st=stem(x); R.kw.push(st); R.chips.push(["wand","“"+x+"”"]); }
    i++;
  }
  return R;
}

function fx(dt){
  const T0=elapsed;
  for(let i=bursts.length-1;i>=0;i--){
    const b=bursts[i]; b.life+=dt; const k=Math.max(0,1-b.life*1.2);
    for(let j=0;j<b.v.length;j++){ b.p[j*3]+=b.v[j].x*dt*k; b.p[j*3+1]+=b.v[j].y*dt*k; b.p[j*3+2]+=b.v[j].z*dt*k; }
    b.g.attributes.position.needsUpdate=true; b.pts.material.opacity=k;
    if(b.life>1){ fxGroup.remove(b.pts); b.g.dispose(); b.pts.material.dispose(); bursts.splice(i,1); }
  }
  if(selected){
    const p=selected.grp.position, c=LANES[selected.d.l].color;
    pillar.position.set(p.x,p.y+20,p.z); pillar.material.color.set(c); pillar.material.opacity+=(.32-pillar.material.opacity)*Math.min(1,dt*4);
    halo2.position.copy(p); halo2.material.color.set(c); const s=selected.size*(10+Math.sin(T0*2.4)*1.6); halo2.scale.set(s,s,1); halo2.material.opacity+=(.5-halo2.material.opacity)*Math.min(1,dt*4);
  } else { pillar.material.opacity*=.9; halo2.material.opacity*=.9; }
  for(const w of waves){ const ph=((T0/3.4)+w.ph)%1, s=.4+ph*1.15; w.m.scale.set(s,s,s); w.m.material.opacity=(1-ph)*(1-ph)*.3; }
  if(!reduceMotion){
    for(let i=0;i<PL;i++){ const ph=plPh[i]; plPos[i*3]=plBase[i*3]+Math.sin(T0*.12+ph)*2; plPos[i*3+1]=plBase[i*3+1]+Math.sin(T0*.35+ph*2)*1.4; plPos[i*3+2]=plBase[i*3+2]+Math.cos(T0*.27+ph)*1.4; }
    plGeo.attributes.position.needsUpdate=true;
  } else if(!fx.done){ plPos.set(plBase); plGeo.attributes.position.needsUpdate=true; fx.done=true; }
  todayRing.scale.setScalar(1+Math.sin(T0*1.4)*.05); todayGlow.material.opacity=.4+Math.sin(T0*1.4)*.12;
  markPstrip();
}

/* ---------- rendering ---------- */
let anTab="overview", anPow="all", anLayer=new Set(["brink","lost","found"]), anSel=null;
function renderAnimals(){
  const tabs=[["overview","chart"],["brink","s_n"],["map","map"],["powers","p_force"],["lost","lost"]];
  document.getElementById("anTabs").innerHTML=tabs.map(([k,i])=>`<button role="tab" data-k="${k}" aria-selected="${k===anTab}">${ico(i)}<span>${esc(t("an_"+k))}</span></button>`).join("");
  document.querySelectorAll("#anTabs button").forEach(b=>b.addEventListener("click",()=>{ anTab=b.dataset.k; renderAnimals(); document.querySelector("#animals .o-body").scrollTop=0; }));
  const box=document.getElementById("anBody");
  box.className="anbody tab-"+anTab;
  if(anTab==="overview") box.innerHTML=anOverview();
  else if(anTab==="brink") box.innerHTML=anBrink();
  else if(anTab==="map") box.innerHTML=anMap();
  else if(anTab==="powers") box.innerHTML=anPowers();
  else box.innerHTML=anLost();
  wireAnimals(box);
  if(LANG!=="en") box.insertAdjacentHTML("beforeend",`<p class="note">${esc(t("entryNote"))}</p>`);
}
function badge(code){ const [n,c]=IUCN[code]; return `<span class="iucn" style="--ic:${c}"><b>${code==="RE"?"↺":code}</b><span lang="en">${esc(n)}</span></span>`; }
function anOverview(){
  const S=AN_STATS, pct=Math.round(S.threatened/S.assessed*100);
  let h=`<div class="stats"><div class="stat"><b data-count="${S.assessed}">0</b><span>${esc(t("an_assessed"))}</span></div><div class="stat red"><b data-count="${S.threatened}">0</b><span>${esc(t("an_threat"))}</span></div><div class="stat"><b data-count="${pct}" data-suffix="%">0</b><span>${esc(t("an_share"))}</span></div></div><p class="src" lang="en">${esc(S.src)}</p>`;
  h+=`<div class="ansec"><h3>${esc(t("an_groups"))}</h3>`+S.groups.map(([g,p,s])=>`<div class="gbar"><div class="gl"><span lang="en">${esc(g)}</span><b>${num(p)}%</b></div><span class="gtrack"><i style="--w:${p}%"></i></span><small lang="en">${esc(s)}</small></div>`).join("")+`</div>`;
  h+=`<div class="ansec"><h3>${esc(t("an_good"))}</h3><div class="goodgrid">`+GOOD.map(([n,tx,s])=>`<div class="good">${ico("up")}<div><b lang="en">${esc(n)}</b><p lang="en">${esc(tx)}</p><small lang="en">${esc(s)}</small></div></div>`).join("")+`</div></div>`;
  h+=`<div class="ansec"><h3>${esc(t("an_how"))}</h3><p lang="en" class="lede2">${esc(S.described)}</p><p class="src" lang="en">${esc(S.describedSrc)}</p><div class="legendrow">${["CR","EN","VU","NT","LC","EW","EX"].map(badge).join("")}</div></div>`;
  return h;
}
function dotsSVG(n,color){
  if(!n) return "";
  const per=n>200?24:n>60?16:10, size=n>200?5:n>60?7:10, cols=Math.min(per,n), rows=Math.ceil(n/per);
  let s=`<svg class="dots" viewBox="0 0 ${per*size} ${rows*size}" style="max-width:${per*size*1.4}px" aria-hidden="true">`;
  for(let i=0;i<n;i++){ const x=(i%per)*size+size/2, y=Math.floor(i/per)*size+size/2; s+=`<circle cx="${x}" cy="${y}" r="${size*.36}" fill="${color}" style="animation-delay:${(i*12)%1800}ms"/>`; }
  return s+"</svg>";
}

      <h4 lang="en">${esc(n)}</h4><p class="latin">${esc(lat)}</p>

      <dl><div><dt>${ico("map")}${esc(t("an_where"))}</dt><dd lang="en">${esc(where)}</dd></div><div><dt>${ico(canV?"s_l":"s_x")}${esc(t("an_visit"))}</dt><dd lang="en">${esc(visit)}</dd></div><div><dt>${ico("s_n")}${esc(t("an_threats"))}</dt><dd lang="en">${esc(threat)}</dd></div></dl>
      <div class="bfoot"><button class="mini" data-showmap="${id}">${ico("target")}${esc(t("an_onmap"))}</button></div>
      <p class="src" lang="en">${esc(src)}</p></article>`;
  }).join("")+`</div>`;
}
let LANDDOTS=null;
function landDots(){
  if(LANDDOTS) return LANDDOTS;
  let bits=""; for(const ch of LANDHEX) bits+=parseInt(ch,16).toString(2).padStart(4,"0");
  const pts=[]; for(let j=0;j<LAND_H;j++) for(let i=0;i<LAND_W;i++) if(bits[j*LAND_W+i]==="1") pts.push([i,j]);
  return LANDDOTS=pts;
}
function proj([lat,lon]){ lat=Math.max(LAT_BOT+2,Math.min(LAT_TOP-2,lat)); return [(lon+180)/360*LAND_W, (LAT_TOP-lat)/(LAT_TOP-LAT_BOT)*LAND_H]; }
function mapPoints(){
  const P=[], vis=anLayer.has("visit");
  if(anLayer.has("brink")||vis) for(const b of BRINK) if(!vis||b[9]) P.push({k:"brink",id:b[0],n:b[1],code:b[3],ll:b[8]});
  if(anLayer.has("lost")) LOST.forEach((l,i)=>P.push({k:"lost",id:"l"+i,n:l[0],code:l[2],ll:l[5]}));
  if(anLayer.has("found")) FOUND.forEach((f,i)=>P.push({k:"found",id:"f"+i,n:f[0],code:"RE",ll:f[4]}));
  return P;
}
function anMap(){
  const dots=landDots().map(([i,j])=>`<circle cx="${i+.5}" cy="${j+.5}" r=".34"/>`).join("");
  const pts=mapPoints();
  const marks=pts.map((p,i)=>{ const [x,y]=proj(p.ll), c=IUCN[p.code][1]; return `<g class="mk${anSel===p.id?" on":""}" data-id="${p.id}" transform="translate(${x.toFixed(2)} ${y.toFixed(2)})" tabindex="0" role="button" aria-label="${esc(p.n)}"><circle r="3.2" fill="transparent"/><circle class="pulse" r="1.4" fill="${c}" style="animation-delay:${(i*170)%2000}ms"/><circle r="1.05" fill="${c}" stroke="#fff" stroke-width=".25"/></g>`; }).join("");
  const layers=[["brink","s_n"],["visit","s_l"],["lost","lost"],["found","p_regen"]];
  return `<div class="chips mapchips">${layers.map(([k,i])=>`<button class="chip" data-layer="${k}" aria-pressed="${anLayer.has(k)}">${ico(i)}${esc(t("an_layer_"+k))}</button>`).join("")}</div>
   <div class="mapwrap"><svg class="wmap" viewBox="0 0 ${LAND_W} ${LAND_H}" role="img" aria-label="${esc(t("an_map"))}"><g class="land">${dots}</g>${marks}</svg><div class="mapcard" id="mapCard">${mapCardHTML()}</div></div>`;
}
function mapCardHTML(){
  if(!anSel) return `<p class="lede2">${esc(t("an_mapHint"))}</p>`;
  const b=BRINK.find(x=>x[0]===anSel);
  if(b) return `${badge(b[3])}<h4 lang="en">${esc(b[1])}</h4><p class="latin">${esc(b[2])}</p><p class="bigpop" lang="en">${esc(b[4])}</p><p lang="en"><b>${esc(b[7])}</b></p><p lang="en">${esc(b[10])}</p><p class="src" lang="en">${esc(b[13])}</p><button class="mini" data-goto="brink:${b[0]}">${esc(t("an_more"))}</button>`;
  if(anSel[0]==="l"){ const l=LOST[+anSel.slice(1)]; return `${badge(l[2])}<h4 lang="en">${esc(l[0])}</h4><p class="latin">${esc(l[1])}</p><p class="bigpop">${esc(l[3])}</p><p lang="en">${esc(l[4])}</p><p class="src" lang="en">${esc(l[6])}</p>`; }
  const f=FOUND[+anSel.slice(1)]; return `${badge("RE")}<h4 lang="en">${esc(f[0])}</h4><p class="latin">${esc(f[1])}</p><p class="bigpop">${esc(f[2])}</p><p lang="en">${esc(f[3])}</p><p class="src" lang="en">${esc(f[5])}</p>`;
}
function anPowers(){
  const list=POWERS.filter(p=>anPow==="all"||p[0]===anPow);
  return `<div class="chips">${["all",...PCATS].map(c=>`<button class="chip" data-pow="${c}" aria-pressed="${anPow===c}">${ico(c==="all"?"all":"p_"+c)}${esc(t("pc_"+c))}</button>`).join("")}</div>
  <div class="pgrid">`+list.map((p,i)=>{ const [c,a,lat,head,tx,e,src,rid]=p; return `<article class="pcard" style="animation-delay:${i*40}ms;--pc:${PCOL[c]}"><div class="picon">${ico("p_"+c)}</div><span class="pcat">${esc(t("pc_"+c))}</span><h4 lang="en">${esc(head)}</h4><p class="pan" lang="en">${esc(a)} <i>${esc(lat)}</i></p><p lang="en">${esc(tx)}</p><div class="pfoot"><span class="ev-k"><span class="dot" style="color:${EV[e].color};background:${EV[e].color}"></span>${esc(tt("ev",e))}</span>${rid&&byId[rid]?`<button class="mini" data-go="${rid}">${esc(t("seeRiver"))}</button>`:""}</div><p class="src" lang="en">${esc(src)}</p></article>`; }).join("")+`</div>`;
}
function anLost(){
  return `<div class="lgrid"><div><h3 class="lh">${ico("lost")}${esc(t("an_recentLost"))}</h3><ol class="tl">`+LOST.slice().sort((a,b)=>b[3]-a[3]).map(l=>`<li><span class="yr">${esc(l[3])}</span><div>${badge(l[2])}<b lang="en">${esc(l[0])}</b> <i>${esc(l[1])}</i><p lang="en">${esc(l[4])}</p><small lang="en">${esc(l[6])}</small></div></li>`).join("")+`</ol></div>
  <div><h3 class="lh">${ico("p_regen")}${esc(t("an_found"))}</h3><ol class="tl found">`+FOUND.map(f=>`<li><span class="yr">${esc(f[2])}</span><div>${badge("RE")}<b lang="en">${esc(f[0])}</b> <i>${esc(f[1])}</i><p lang="en">${esc(f[3])}</p><small lang="en">${esc(f[5])}</small></div></li>`).join("")+`</ol></div></div>`;
}
function wireAnimals(box){
  box.querySelectorAll("[data-count]").forEach(el=>{
    const target=+el.dataset.count, suf=el.dataset.suffix||"", t0=performance.now(), dur=reduceMotion?1:1400;
    const step=now=>{ const k=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-k,3); el.textContent=num(Math.round(target*e))+suf; if(k<1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
  box.querySelectorAll("[data-showmap]").forEach(b=>b.addEventListener("click",()=>{ anSel=b.dataset.showmap; anLayer.add("brink"); anTab="map"; renderAnimals(); }));
  box.querySelectorAll("[data-pow]").forEach(b=>b.addEventListener("click",()=>{ anPow=b.dataset.pow; renderAnimals(); }));
  box.querySelectorAll("[data-layer]").forEach(b=>b.addEventListener("click",()=>{ const k=b.dataset.layer; if(anLayer.has(k)) anLayer.delete(k); else anLayer.add(k); renderAnimals(); }));
  box.querySelectorAll(".mk").forEach(g=>{ const go=()=>{ anSel=g.dataset.id; box.querySelectorAll(".mk").forEach(x=>x.classList.toggle("on",x===g)); document.getElementById("mapCard").innerHTML=mapCardHTML(); wireCard(); if(matchMedia("(max-width:760px)").matches) document.getElementById("mapCard").scrollIntoView({block:"nearest",behavior:"smooth"}); }; g.addEventListener("click",go); g.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); go(); } }); });
  box.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>goRiver(b.dataset.go)));
  wireCard();
  if(anTab==="brink"&&anSel){ const c=document.getElementById("bc-"+anSel); if(c){ c.scrollIntoView({block:"center"}); c.classList.add("flash"); } }
}
function wireCard(){
  const b=document.querySelector("#mapCard [data-goto]"); if(b) b.addEventListener("click",()=>{ anSel=b.dataset.goto.split(":")[1]; anTab="brink"; renderAnimals(); });
}

setLang("en"); applyFilters(); setOffsetForPanel(false);
requestAnimationFrame(frame);
})();

</script>
</body>
</html>
